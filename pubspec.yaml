name: pharos
description: Real-time voice phishing and deepfake detection Android app using Flutter.
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio Recording & Processing
  record: ^4.4.4
  wav: ^1.0.3

  # Background Service & Notifications
  flutter_background_service: ^5.0.3
  flutter_background_service_android: ^5.0.5
  flutter_notification_center: ^1.0.0
  flutter_local_notifications: ^14.1.1

  # Call State Detection
  telephony: ^0.2.5
  phone_state: ^2.1.0

  # Permissions
  permission_handler: ^11.4.3

  # State Management
  provider: ^6.0.0
  get_it: ^7.5.0

  # UI & Animations
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  gradient_animated_button: ^1.3.0

  # File Management
  path_provider: ^2.1.0
  intl: ^0.19.0

  # Utilities
  uuid: ^4.0.0
  logger: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: InterRegular
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: InterBold
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-Bold-Italic.ttf
          style: italic
